# =========================================================
# MONALISA V2
# =========================================================
#
# Warm cinematic terminal theme inspired by:
#
# - amber CRT displays
# - noir aesthetics
# - cyberpunk warmth
# - retro terminal interfaces
#
# V2 focuses on:
#
# - improved readability
# - stronger ANSI contrast
# - cleaner blue/cyan tones
# - better visibility in Fish and Git prompts
#
# =========================================================


# =========================================================
# BASE COLORS
# =========================================================

# Main background color.
background #110b0d

# Default text color.
foreground #f6d56a


# =========================================================
# CURSOR
# =========================================================

cursor #d67a3c


# =========================================================
# SELECTION
# =========================================================

selection_background #f6d56a
selection_foreground #110b0d


# =========================================================
# ANSI COLORS
# =========================================================

