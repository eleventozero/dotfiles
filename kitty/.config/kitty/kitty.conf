# =========================================================
# KITTY TERMINAL CONFIGURATION
# =========================================================
#
# Minimal modern terminal setup focused on:
#
# - clean aesthetics
# - GPU rendering
# - low latency
# - keyboard-driven workflows
# - theme modularity
# - developer productivity
#
# Theme colors are intentionally separated into:
#
# current-theme.conf
#
# This keeps terminal behavior and visual styling modular.
#
# =========================================================


# =========================================================
# FONT SETTINGS
# =========================================================

# Main terminal font.
# Nerd Font variant provides icon support for:
# - prompts
# - Git symbols
# - Neovim plugins
# - terminal tooling
font_family JetBrainsMonoNL Nerd Font

# Terminal font size.
font_size 13.5


# =========================================================
# WINDOW APPEARANCE
# =========================================================

# Inner terminal padding.
window_padding_width 12

# Cursor appearance.
cursor_shape beam
cursor_blink_interval 1

# Transparent background.
background_opacity 0.75

# Background blur effect.
# Depends on compositor/window manager support.
background_blur 10

# Disable terminal bell sound.
enable_audio_bell no

# Disable confirmation when closing terminal windows.
confirm_os_window_close 0

# Hide the operating system window title bar / window decorations.
hide_window_decorations yes

# =========================================================
# TAB BAR
# =========================================================

tab_bar_style hidden

map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab


# =========================================================
# SCROLLBACK
# =========================================================

# Number of scrollback lines kept in memory.
scrollback_lines 8000

# Hide scrollbar for cleaner UI.
scrollbar_width 0


# =========================================================
# CLIPBOARD
# =========================================================

# Clipboard shortcuts.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


# =========================================================
# URL HANDLING
# =========================================================

# Open URLs using the default system handler.
open_url_with default


# =========================================================
# PERFORMANCE
# =========================================================

# Lower repaint delay for smoother rendering.
repaint_delay 7

# NOTE:
# Kitty usually auto-detects the correct display server.
# Explicitly forcing X11 is often unnecessary and may
# cause issues on Wayland-based systems.
#
# Uncomment only if needed.
#
# linux_display_server x11


# =========================================================
# THEME SYSTEM
# =========================================================

# Dynamically load the currently active theme.
#
# Example:
# current-theme.conf -> themes/MonaLisa.conf
#
# Theme switching is handled through Fish helper functions.
include current-theme.conf
