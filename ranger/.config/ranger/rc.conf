# =========================================================
# RANGER CONFIGURATION
# =========================================================
#
# Minimal Ranger setup for a terminal-first workflow.
#
# Focus:
# - Kitty image previews
# - Neovim integration
# - clean navigation
# - clipboard workflow
#
# =========================================================


# =========================================================
# VIEW
# =========================================================

set viewmode miller
set column_ratios 1,3,4

set show_hidden false
set hidden_filter ^\.|\.(?:pyc|pyo|bak|swp)$|^lost\+found$|^__(py)?cache__$

set sort natural
set sort_case_insensitive true
set sort_directories_first true


# =========================================================
# PREVIEW
# =========================================================

set preview_files true
set preview_directories true
set collapse_preview true

set use_preview_script true

set preview_images true
set preview_images_method kitty

# Avoid previewing files larger than this size.
# 0 disables the limit.
set preview_max_size 0


# =========================================================
# UI
# =========================================================

set colorscheme default
set draw_borders none
set mouse_enabled true

set display_size_in_main_column true
set display_size_in_status_bar true
set display_free_space_in_status_bar true

set unicode_ellipsis false
set scroll_offset 8
set flushinput true
set padding_right true


# =========================================================
# SAFETY
# =========================================================

set confirm_on_delete multiple
set nested_ranger_warning true


# =========================================================
# BASIC KEYBINDINGS
# =========================================================

map q quit
map Q quitall
map R reload_cwd

map zh set show_hidden!
map <C-h> set show_hidden!

map i display_file
map ? help
map : console
map ; console
map ! console shell%space
map S shell $SHELL


# =========================================================
# NAVIGATION
# =========================================================

map gh cd ~
map gd cd ~/Downloads
map gp cd ~/Projects
map gc cd ~/.config
map gr cd /

map H history_go -1
map L history_go 1


# =========================================================
# FILE OPERATIONS
# =========================================================

map cw console rename%space
map a rename_append

map dd cut
map yy copy
map pp paste
map dD console delete
map dT console trash

map yp yank path
map yd yank dir
map yn yank name
map y. yank name_without_extension


# =========================================================
# NEOVIM INTEGRATION
# =========================================================

# Open file in Neovim.
map e shell nvim -- %f
map <ENTER> shell nvim -- %f
map <CR> shell nvim -- %f


# =========================================================
# CLIPBOARD INTEGRATION
# =========================================================
#
# Requires wl-clipboard on Wayland:
# sudo apt install wl-clipboard
#
# If using X11, replace wl-copy with xclip/xsel.

# Copy file content to clipboard.
map yc shell -- sh -c 'cat "$1" | wl-copy' sh %f

# Copy file path to clipboard.
map yP shell -- sh -c 'printf "%s/%s" "$1" "$2" | wl-copy' sh %d %f

# Copy selected files with headers.
map yC shell -- sh -c 'for f in "$@"; do echo "===== $f ====="; cat "$f"; echo; done | wl-copy' sh %s
