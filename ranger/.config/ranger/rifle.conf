# =========================================================
# RANGER RIFLE CONFIGURATION
# =========================================================
#
# Rifle decides how files are opened from Ranger.
#
# Focus:
# - code/text files open in Neovim
# - images open with default GUI image viewer
# - PDFs open with default document viewer
# - unknown files fall back to xdg-open
#
# =========================================================


# =========================================================
# TEXT / CODE
# =========================================================

# Open common text and code files with Neovim.
ext md|txt|lua|java|c|cpp|h|hpp|py|sh|bash|fish|html|css|js|ts|json|xml|csv|tex|yml|yaml|toml|ini|conf = nvim -- "$@"

# Fallback for text files.
mime ^text = ${VISUAL:-$EDITOR} -- "$@"


# =========================================================
# MARKDOWN
# =========================================================

# Markdown is edited in Neovim.
ext md = nvim -- "$@"


# =========================================================
# IMAGES
# =========================================================

# Open images with the default desktop application.
mime ^image, has xdg-open, X, flag f = xdg-open -- "$@"

# Fallback image viewers if installed.
mime ^image, has imv, X, flag f = imv -- "$@"
mime ^image, has feh, X, flag f = feh -- "$@"
mime ^image, has eog, X, flag f = eog -- "$@"


# =========================================================
# PDF / DOCUMENTS
# =========================================================

# Open PDFs with default desktop application.
ext pdf, has xdg-open, X, flag f = xdg-open -- "$@"

# Optional PDF viewers.
ext pdf, has zathura, X, flag f = zathura -- "$@"
ext pdf, has evince, X, flag f = evince -- "$@"


# =========================================================
# AUDIO / VIDEO
# =========================================================

# Prefer mpv if available.
mime ^video|audio, has mpv, X, flag f = mpv -- "$@"

# Fallback to xdg-open.
mime ^video|audio, has xdg-open, X, flag f = xdg-open -- "$@"


# =========================================================
# ARCHIVES
# =========================================================

# List zip files.
ext zip, has unzip = unzip -l "$1" | "$PAGER"

# Extract zip files.
ext zip, has unzip = unzip -d "${1%.*}" "$1"

# List tar archives.
ext tar|gz|bz2|xz, has tar = tar vvtf "$1" | "$PAGER"

# Extract tar archives.
ext tar|gz|bz2|xz, has tar = tar vvxf "$1"


# =========================================================
# FALLBACKS
# =========================================================

# Ask what to do for unknown files.
else = ask

# Generic desktop opener.
label open, has xdg-open = xdg-open -- "$@"

# Editor fallback.
label editor = ${VISUAL:-$EDITOR} -- "$@"

# Pager fallback.
label pager = "$PAGER" -- "$@"
